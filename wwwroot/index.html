let provider, signer, contract;
const el = id => document.getElementById(id);

async function refreshBalance(){
    const res = await fetch('/api/tip/total');
    const total = await res.json();
    el('bal').textContent = (total/1e18).toFixed(4);
}

el('connect').onclick = async () => {
    provider = new ethers.BrowserProvider(window.ethereum);
    await window.ethereum.request({ method: "eth_requestAccounts" });
    signer = await provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
    alert("MetaMask підключено ✅");
    await refreshBalance();
};

el('send').onclick = async () => {
    const value = el('eth').value;
    const msg = el('msg').value;
    const tx = await contract.tip(msg, { value: ethers.parseEther(value) });
    await tx.wait();
    alert("Відправлено!");
    await refreshBalance();
};

el('showTips').onclick = async () => {
    const resp = await fetch('/api/tip/last?count=10');
    const tips = await resp.json();
    let out = "Останні 10 чаєвих:\n";
    tips.forEach(t => {
        const time = new Date(t.time*1000).toLocaleString();
        out += `${t.from} — ${(t.amount/1e18).toFixed(4)} ETH — "${t.message}" — ${time}\n`;
    });
    el('log').textContent = out;
};

el('showTop').onclick = async () => {
    const resp = await fetch('/api/tip/top');
    const top = await resp.json();
    let out = "Топ-3 донатерів:\n";
    top.forEach(t => out += `${t.address} — ${t.total.toFixed(4)} ETH\n`);
    el('log').textContent = out;
};
